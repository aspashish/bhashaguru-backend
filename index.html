    <meta charset="UTF-8" />

    <meta name="description" content="Interactive AI English learning app for Hindi speakers to master vocabulary, pronunciation, grammar, and speaking." />
    <meta property="og:title" content="BhashaGuru AI English Teacher" />

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem('bhashaguru_settings_v1');
          if (s) {
            var parsed = JSON.parse(s);
            if (parsed.darkMode === false) {
              document.documentElement.classList.remove('dark');
            } else {
              document.documentElement.classList.add('dark');
            }
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
