# ==============================================================================
# BHASHAGURU — RENDER BLUEPRINT SPECIFICATION
# Deploy the production Node.js + Express + WebSocket backend on Render.com
# ==============================================================================

services:
  - type: web
    name: bhashaguru-backend
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_API_KEY
        sync: false
      - key: PORT
        value: 10000
